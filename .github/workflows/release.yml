name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'YuJunZhiXue/dsh-purge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Syntax-check plugin entry
        run: |
          node --check lib/index.js
          node --check lib/core.js
          node --check lib/reapply.js
          node --input-type=module -e "import './lib/index.js'"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "already published: $tag"
            exit 0
          fi
          first="$(head -n 1 release-notes.md | tr -d '\r')"
          if [ "$first" != "# ${version}" ]; then
            echo "release-notes.md 第一行必须是 # ${version}，现在是: ${first}"
            exit 1
          fi
          zip="dsh-purge-${version}.zip"
          if git rev-parse -q --verify "refs/tags/${tag}^{}" >/dev/null; then
            commit="$(git rev-parse "refs/tags/${tag}^{}")"
            git archive --format=zip --prefix="dsh-purge-${version}/" --output="$zip" "$commit"
            gh release create "$tag" --title "$tag" --notes-file release-notes.md
          else
            git archive --format=zip --prefix="dsh-purge-${version}/" --output="$zip" HEAD
            args=(release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file release-notes.md)
            case "$version" in
              *beta*|*alpha*|*rc*) args+=(--prerelease) ;;
            esac
            gh "${args[@]}"
          fi
          test -s "$zip"
          gh release upload "$tag" "$zip" --clobber
          echo "published https://github.com/YuJunZhiXue/dsh-purge/releases/tag/${tag}"

      # Sign the SAME zip that was just uploaded. The plugin refuses to install a
      # tag release whose signature is missing or invalid (lib/release-signature.js),
      # so a broken/missing secret must fail the build, not publish unsigned bytes.
      - name: Sign release archive
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          zip="dsh-purge-${version}.zip"
          if [ -z "${RELEASE_SIGNING_KEY:-}" ]; then
            echo "RELEASE_SIGNING_KEY is not configured."
            echo "Generate one with: node scripts/generate-signing-key.mjs"
            echo "Then: gh secret set RELEASE_SIGNING_KEY < dsh-purge-signing.key"
            exit 1
          fi
          node scripts/sign-release.mjs "$zip" "$version"
          gh release upload "$tag" "${zip}.sig" --clobber
          echo "signed and uploaded ${zip}.sig"
