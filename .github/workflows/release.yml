name: Release

on:
  push:
    # `mit-1.1.72` is the maintained line for this fork: upstream moved to a
    # commercial license and `master` now carries that, while this branch keeps the
    # MIT-based work. Release from it, otherwise pushing would never build anything.
    branches:
      - mit-1.1.72
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    # Release 只在「发布源仓库」跑。这里不再写死上游，而是跟着 lib/update.js 的
    # 默认发布源走：上游已暂停更新，签名产物必须由我们自己的仓库产出。
    # 同步上游时若改了 update.js 的 DEFAULT_REPO，记得同步这一行。
    if: github.repository == 'xlht4106/dsh-purge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Syntax-check plugin entry
        run: |
          node --check lib/index.js
          node --check lib/core.js
          node --check lib/reapply.js
          node --input-type=module -e "import './lib/index.js'"

      - name: Publish GitHub Release
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          zip="dsh-purge-${version}.zip"

          # Already released: nothing to publish, and signing is skipped below.
          # Previously this branch did `exit 0`, which silently skipped packaging
          # while the *next* step still tried to sign a zip that was never built —
          # so any push that did not bump the version failed the whole run.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "already published: $tag"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          first="$(head -n 1 release-notes.md | tr -d '\r')"
          if [ "$first" != "# ${version}" ]; then
            echo "release-notes.md 第一行必须是 # ${version}，现在是: ${first}"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/${tag}^{}" >/dev/null; then
            commit="$(git rev-parse "refs/tags/${tag}^{}")"
            git archive --format=zip --prefix="dsh-purge-${version}/" --output="$zip" "$commit"
            gh release create "$tag" --title "$tag" --notes-file release-notes.md
          else
            git archive --format=zip --prefix="dsh-purge-${version}/" --output="$zip" HEAD
            args=(release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file release-notes.md)
            case "$version" in
              *beta*|*alpha*|*rc*) args+=(--prerelease) ;;
            esac
            gh "${args[@]}"
          fi
          test -s "$zip"
          gh release upload "$tag" "$zip" --clobber
          echo "published https://github.com/xlht4106/dsh-purge/releases/tag/${tag}"
          echo "published=true" >> "$GITHUB_OUTPUT"

      # Sign the SAME zip that was just uploaded. The plugin refuses to install a
      # tag release whose signature is missing or invalid (lib/release-signature.js),
      # so a broken/missing secret must fail the build, not publish unsigned bytes.
      #
      # Skipped when Publish found the tag already released: in that case no zip was
      # built in this run, and failing here would turn every non-release push red.
      - name: Sign release archive
        if: steps.publish.outputs.published == 'true'
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          zip="dsh-purge-${version}.zip"
          if [ -z "${RELEASE_SIGNING_KEY:-}" ]; then
            echo "RELEASE_SIGNING_KEY is not configured."
            echo "Generate one with: node scripts/generate-signing-key.mjs"
            echo "Then: gh secret set RELEASE_SIGNING_KEY < dsh-purge-signing.key"
            exit 1
          fi
          node scripts/sign-release.mjs "$zip" "$version"
          gh release upload "$tag" "${zip}.sig" --clobber
          echo "signed and uploaded ${zip}.sig"
